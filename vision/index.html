<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vision Nendy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Montserrat:ital,wght@0,400;0,500;1,700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Playfair+Display+SC&display=swap">
<style>
/* Layout : fond d'écran vivant 16:9 — colonne marque à gauche, tableau de bord du jour à droite. Look unique, clair (DA Nendy Services). */
:root{
  --ivory:#fffdf8; --sand:#f8f1e3; --card:#ffffff; --ink:#1a1714; --muted:#6b6358;
  --gold:#c9ad6a; --sage:#7b9a80; --fux:#ee07a5; --line:#c9ad6a66;
  --display:'Playfair Display','Georgia',serif; --sc:'Playfair Display SC','Georgia',serif;
  --body:'Montserrat','Helvetica Neue',Arial,sans-serif; --mono:'DM Mono','Menlo',monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 30% 20%,#fff 0%,var(--ivory) 45%,var(--sand) 100%);background-color:var(--ivory);color:var(--ink);font-family:var(--body);overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.wrap{position:relative;height:100%;display:grid;grid-template-columns:30% 1fr;gap:2.4vw;padding-block:2.6vw;padding-left:max(2.6vw,env(safe-area-inset-left,0px));padding-right:max(2.6vw,env(safe-area-inset-right,0px));box-sizing:border-box}
.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.4vw}
.brand img{width:60%;max-width:100%}
.slogan{font-weight:700;font-style:italic;color:var(--fux);font-size:1vw}
.hello{font-family:var(--display);font-style:italic;font-size:2.2vw;line-height:1.15;margin-top:1.2vw}
.date{font-family:var(--mono);font-size:.62vw;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
.focus{font-size:.9vw;color:var(--muted);max-width:80%;line-height:1.5}
.focus b{color:var(--ink);font-weight:500}
.lab{font-family:var(--mono);font-size:.6vw;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.panel{background:#ffffffcc;border:1px solid var(--line);border-radius:1.6vw;box-shadow:0 2vw 4vw -2vw #b89a5a55;padding:2vw 2.4vw;display:flex;flex-direction:column;gap:1.1vw;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline}
.head h1{font-family:var(--sc);font-weight:400;font-size:2.6vw;color:var(--sage);letter-spacing:.05em;margin:0}
.head h1 span{color:var(--gold)}
.row1{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:1vw;flex:1.25;min-height:0}
.tile{border-radius:1vw;padding:1.5vw 1.7vw;position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.t-mantra{background:linear-gradient(160deg,#ff5cc6,var(--fux) 60%,#b8057f);color:#fff}
.t-mantra .lab{color:#fff;opacity:.85}
.t-mantra .txt{font-family:var(--display);font-style:italic;font-size:2.9vw;line-height:1.1;margin-top:auto;margin-bottom:auto;text-wrap:balance}
.t-white{background:var(--card);border:1px solid var(--line)}
.t-energy{background:linear-gradient(170deg,var(--ivory),#f6eedc);border:1px solid var(--line)}
.big-it{font-family:var(--display);font-style:italic;font-size:1.65vw;line-height:1.3;margin-top:auto;margin-bottom:auto;text-wrap:balance}
.big-it em{color:var(--fux)}
.moon{display:flex;align-items:center;gap:1vw;margin-top:.9vw}
.moon svg{width:3.2vw;height:3.2vw;flex:none}
.moon .ph{font-family:var(--display);font-weight:600;font-size:1.25vw}
.moon .pct{font-family:var(--mono);font-size:.6vw;letter-spacing:.2em;color:var(--muted);margin-top:.2vw}
.energy-act{font-size:.92vw;line-height:1.5;color:var(--muted);margin-top:.9vw}
.energy-act b{color:var(--ink);font-weight:500}
.affirm{background:var(--ink);color:#fff;border-radius:1vw;padding:1.3vw 1.8vw;display:flex;align-items:center;gap:2vw}
.affirm .txt{font-family:var(--display);font-style:italic;font-size:1.75vw;line-height:1.25}
.affirm .txt em{color:var(--fux)}
.objs{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vw}
.obj{background:var(--card);border:1px solid var(--line);border-radius:.9vw;padding:1vw 1.1vw;display:flex;flex-direction:column;gap:.45vw;min-width:0}
.obj .n{display:flex;align-items:baseline;gap:.4vw;font-variant-numeric:tabular-nums}
.obj .n b{font-family:var(--sc);font-weight:400;color:var(--fux);font-size:1.9vw;line-height:1}
.obj .n span{font-family:var(--mono);font-size:.7vw;color:var(--muted)}
.obj .t{font-family:var(--display);font-weight:600;font-size:.98vw;line-height:1.15}
.bar{height:.32vw;background:#f1e8d4;border-radius:1vw;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--fux));border-radius:1vw}
.foot{display:flex;justify-content:space-between;align-items:center;gap:1vw}
.count{font-family:var(--display);font-size:1.05vw}
.count b{font-family:var(--sc);font-weight:400;color:var(--fux);font-size:1.5vw;margin-right:.3vw}
.dots{display:flex;gap:.35vw}
.dots i{width:.5vw;height:.5vw;border-radius:50%;border:1px solid var(--gold)}
.dots i.on{background:var(--fux);border-color:var(--fux)}
@media (max-width:900px){
  body{overflow:auto}
  .wrap{grid-template-columns:1fr;height:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;gap:20px}
  .brand img{width:45%}.slogan{font-size:14px}.hello{font-size:28px}.date,.lab{font-size:10px}.focus{font-size:14px}
  .panel{padding:20px;border-radius:20px;gap:14px}.head h1{font-size:26px}
  .row1{grid-template-columns:1fr;gap:12px}.tile{padding:20px;border-radius:16px}
  .t-mantra .txt{font-size:36px}.big-it{font-size:22px}.moon svg{width:44px;height:44px}.moon .ph{font-size:18px}.moon .pct{font-size:10px}.energy-act{font-size:14px}
  .affirm{padding:20px;border-radius:16px;flex-direction:column;align-items:flex-start;gap:8px}.affirm .txt{font-size:24px}
  .objs{grid-template-columns:1fr 1fr;gap:10px}.obj{padding:14px;border-radius:14px;gap:6px}.obj .n b{font-size:28px}.obj .n span{font-size:11px}.obj .t{font-size:15px}.bar{height:5px}
  .foot{flex-direction:column;align-items:flex-start}.count{font-size:16px}.count b{font-size:24px}.dots i{width:8px;height:8px}
}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade 1.2s ease both}@keyframes fade{from{opacity:.3}to{opacity:1}}}
</style>

</head>

const MANTRAS = ["Calme.<br>Clarté.<br>Croissance.","Je ne cours pas.<br>J’avance.","Moins, <br>mais mieux.","Une chose<br>à la fois.","Simple<br>et constant.","Je choisis<br>la clarté.","Pas à pas,<br>ça grandit.","Je ralentis<br>pour aller loin.","Ordre dehors,<br>calme dedans.","Ce qui est clair<br>avance.","Je fais de la place<br>au nouveau.","Ma régularité<br>est ma force.","Fini vaut mieux<br>que parfait.","Je pilote,<br>je ne subis pas."];
const AFFIRM = ["Je mérite des clients <em>qui me ressemblent.</em>","Mon calme est <em>ma force.</em>","Je construis, <em>pas à pas.</em>","Mon travail a <em>de la valeur.</em>","J’ose annoncer <em>mes prix.</em>","Je délègue ce qui <em>ne me nourrit pas.</em>","Mes offres <em>aident vraiment.</em>","Je suis à ma place <em>dans ce métier.</em>","Je peux dire non <em>sans me justifier.</em>","Chaque client satisfait <em>en appelle un autre.</em>","J’ai le droit <em>de me reposer.</em>","Je crée un business <em>qui respire.</em>","Ma façon de travailler <em>est un atout.</em>","Je reçois avec <em>gratitude.</em>"];
const RAPPELS = ["Tu as osé te lancer. <em>Maintenant, brille.</em>","Monter en gamme, rester simple, et faire grandir des business <em>qui respirent.</em>","Une petite action aujourd’hui <em>vaut mieux qu’un grand plan demain.</em>","Ton calendrier dit ce qui compte. <em>Protège-le.</em>","Range d’abord, <em>crée ensuite.</em>","Un message à un prospect aujourd’hui. <em>Un seul suffit.</em>","Ce que tu montres, <em>on te l’achète.</em>","Note une victoire, <em>même petite.</em>","Ferme les onglets. <em>Respire.</em>","Ton audit change la vie de quelqu’un. <em>Parle-en.</em>"];
const JOURS = [
  ["Dimanche","Repos. Rien à prouver aujourd’hui."],
  ["Lundi","<b>Planifier :</b> choisis tes 3 priorités de la semaine."],
  ["Mardi","<b>Créer :</b> un contenu pour Instagram."],
  ["Mercredi","<b>Clients :</b> avancer les missions en cours."],
  ["Jeudi","<b>Développer :</b> un message à un prospect ou un partenaire."],
  ["Vendredi","<b>Bilan :</b> factures, chiffres, une victoire de la semaine."],
  ["Samedi","Jour libre. Le business tourne aussi quand tu souffles."]
];

const pick=(arr,d,off=0)=>arr[(dayIndex(d)+off)%arr.length];
function dayIndex(d){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5)}

/* Phase de lune (calcul astronomique moyen, précis à ~1 jour) */
function moon(d){
  const syn=29.530588853, ref=Date.UTC(2000,0,6,18,14);
  let age=((d.getTime()-ref)/864e5)%syn; if(age<0)age+=syn;
  const illum=(1-Math.cos(2*Math.PI*age/syn))/2;
  let k; if(age<1.85)k=0;else if(age<5.54)k=1;else if(age<9.23)k=2;else if(age<12.92)k=3;else if(age<16.61)k=4;else if(age<20.30)k=5;else if(age<23.99)k=6;else if(age<27.68)k=7;else k=0;
  return {age,illum,k};
}
const PHASES=[
  ["Nouvelle lune","<b>Intention :</b> pose une seule intention pour ton business ce mois-ci."],
  ["Premier croissant","<b>Lancer :</b> fais le premier pas concret vers ton intention."],
  ["Premier quartier","<b>Ajuster :</b> ce qui bloque, on le règle maintenant."],
  ["Lune gibbeuse croissante","<b>Peaufiner :</b> relis, améliore, prépare la mise en avant."],
  ["Pleine lune","<b>Visibilité :</b> montre ton travail, publie, fais ton bilan."],
  ["Lune gibbeuse décroissante","<b>Partager :</b> remercie un client, demande un avis."],
  ["Dernier quartier","<b>Trier :</b> lâche une tâche ou un outil qui ne te sert plus."],
  ["Dernier croissant","<b>Ralentir :</b> range, repose-toi, prépare le prochain cycle."]
];
function drawMoon(m){
  const s=document.getElementById('moonsvg'); const r=44;
  const waxing=m.age<29.530588853/2; const x=r*Math.cos(2*Math.PI*m.age/29.530588853);
  const sweepOuter=waxing?1:0;
  const lit=`M0,${-r} A${r},${r} 0 0 ${sweepOuter} 0,${r} A${Math.abs(x)},${r} 0 0 ${(waxing? (x>0?0:1) : (x>0?1:0))} 0,${-r}Z`;
  s.innerHTML=`<circle r="${r}" fill="#f1e8d4" stroke="#c9ad6a" stroke-width="2"/><path d="${lit}" fill="#c9ad6a"/>`;
}

function render(){
  const d=new Date(); const h=d.getHours();
  document.getElementById('hello').textContent = h<12?"Bonjour Nendy.":h<18?"Bel après-midi, Nendy.":"Bonsoir Nendy.";
  document.getElementById('date').textContent = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const j=JOURS[d.getDay()]; document.getElementById('focus').innerHTML = j[1];
  document.getElementById('mantra').innerHTML = pick(MANTRAS,d);
  document.getElementById('affirm').innerHTML = pick(AFFIRM,d,3);
  document.getElementById('rappel').innerHTML = pick(RAPPELS,d,5);
  const m=moon(d); drawMoon(m);
  document.getElementById('phase').textContent=PHASES[m.k][0];
  document.getElementById('illum').textContent=Math.round(m.illum*100)+" % éclairée";
  document.getElementById('energy').innerHTML=PHASES[m.k][1];
  document.getElementById('objs').innerHTML = OBJECTIFS.map(o=>{const p=Math.min(100,Math.round(o.fait/o.but*100));return `<div class="obj"><div class="n"><b>${o.fait}</b><span>/ ${o.but}</span></div><div class="t">${o.t}</div><div class="bar"><i style="width:${Math.max(p,2)}%"></i></div></div>`}).join('');
  const days=Math.max(0,Math.ceil((BILAN-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5));
  document.getElementById('count').innerHTML = `<b>${days}</b> jours avant le bilan de fin mars`;
  const dow=(d.getDay()+6)%7; document.getElementById('week').innerHTML=[0,1,2,3,4,5,6].map(i=>`<i class="${i<=dow?'on':''}"></i>`).join('');
}

/* Étoiles */
function sky(){
  const c=document.getElementById('sky'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  let seed=dayIndex(new Date()); const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const cols=['#c9ad6a','#c9ad6a','#c9ad6a','#c9ad6a','#ee07a5','#7b9a80'];
  for(let i=0;i<70;i++){
    const px=rnd()*innerWidth, py=rnd()*innerHeight;
    const inPanel=px>innerWidth*0.31&&py>innerHeight*0.03&&py<innerHeight*0.97; const inBrand=px>innerWidth*0.04&&px<innerWidth*0.3&&py>innerHeight*0.26&&py<innerHeight*0.76; const r2=rnd(); if(inBrand) continue; if(inPanel&&r2>0.12) continue;
    const s=(0.25+rnd()*1.1)*(innerWidth/1600), col=cols[Math.floor(rnd()*cols.length)];
    x.save();x.translate(px,py);x.scale(s,s);x.globalAlpha=0.35+rnd()*0.65;x.fillStyle=col;x.beginPath();
    x.moveTo(0,-10);x.bezierCurveTo(1.2,-2.4,2.4,-1.2,10,0);x.bezierCurveTo(2.4,1.2,1.2,2.4,0,10);x.bezierCurveTo(-1.2,2.4,-2.4,1.2,-10,0);x.bezierCurveTo(-2.4,-1.2,-1.2,-2.4,0,-10);x.fill();x.restore();
  }
}
render(); sky();
let last=new Date().toDateString();
setInterval(()=>{const n=new Date().toDateString(); render(); if(n!==last){last=n; sky();}},60000);
addEventListener('resize',sky);
</script>
